name: Deployment
on:
  push:
    branches: [ main ]

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Update PKGBUILD version
        run: |
          python3 .gitea/workflows/update_version.py
      - name: Publish AUR package
        uses: https://github.com/KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: l1p0-menus-git
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
      - name: Install Build and Hatch
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: https://github.com/pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
